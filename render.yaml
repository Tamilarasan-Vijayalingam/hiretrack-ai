# render.yaml - Infrastructure as Code for Render
services:
  - type: web
    name: hiretrack-backend
    env: docker
    region: oregon
    plan: free # Can be upgraded to starter/standard
    branch: main
    healthCheckPath: /api/health
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: hiretrack-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: hiretrack-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: hiretrack-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: hiretrack-db
    databaseName: hiretrack
    user: hiretrack_admin
    plan: free
